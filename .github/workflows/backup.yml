name: Automated Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: "Backup type"
        required: true
        default: "postgres"
        type: choice
        options:
          - postgres
          - redis
          - all

jobs:
  backup-postgres:
    name: Backup PostgreSQL
    if: github.event.inputs.backup_type == 'postgres' || github.event.inputs.backup_type == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      RETENTION_DAILY: 7
      RETENTION_WEEKLY: 4
      RETENTION_MONTHLY: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age awscli jq
          age --version
          aws --version

      - name: Run PostgreSQL backup
        id: backup
        run: |
          chmod +x scripts/backup_postgres.sh
          ./scripts/backup_postgres.sh

      - name: Verify backup
        run: |
          # Check manifest exists and is recent
          MANIFEST=$(aws ${AWS_CLI_OPTS:-} s3 cp s3://${BACKUP_S3_BUCKET}/postgres/metadata/backup-manifest.json -)
          echo "$MANIFEST" | jq -r '.latest_backup.file'
          echo "$MANIFEST" | jq -r '.latest_backup.timestamp'

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 *PostgreSQL Backup Failed*",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*PostgreSQL backup failed* for `${{ github.repository }}`"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Workflow:* ${{ github.workflow }}"},
                  {"type": "mrkdwn", "text": "*Run:* ${{ github.run_id }}"},
                  {"type": "mrkdwn", "text": "*Branch:* ${{ github.ref }}"},
                  {"type": "mrkdwn", "text": "*Time:* $(date -u)"}
                ]},
                {"type": "section", "text": {"type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  backup-redis:
    name: Backup Redis
    if: github.event.inputs.backup_type == 'redis' || github.event.inputs.backup_type == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools age awscli
          age --version
          aws --version

      - name: Run Redis backup
        run: |
          chmod +x scripts/backup_redis.sh
          ./scripts/backup_redis.sh

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 *Redis Backup Failed*",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Redis backup failed* for `${{ github.repository }}`"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Workflow:* ${{ github.workflow }}"},
                  {"type": "mrkdwn", "text": "*Run:* ${{ github.run_id }}"}
                ]},
                {"type": "section", "text": {"type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  test-restore:
    name: Test Restore (Weekly)
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0'
    needs: [backup-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FORCE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age awscli
          age --version
          aws --version

      - name: Get latest backup
        id: latest
        run: |
          LATEST=$(aws ${AWS_CLI_OPTS:-} s3 ls s3://${BACKUP_S3_BUCKET}/postgres/daily/ --recursive | sort -k1,2 | tail -1 | awk '{print $4}')
          echo "backup_path=$LATEST" >> $GITHUB_OUTPUT

      - name: Restore to staging
        run: |
          chmod +x scripts/restore_postgres.sh
          ./scripts/restore_postgres.sh "s3://${BACKUP_S3_BUCKET}/${{ steps.latest.outputs.backup_path }}"

      - name: Run smoke tests
        run: |
          # Basic verification
          psql "${STAGING_DATABASE_URL}" -c "SELECT count(*) FROM users;"
          psql "${STAGING_DATABASE_URL}" -c "SELECT count(*) FROM budgets;"
          psql "${STAGING_DATABASE_URL}" -c "SELECT count(*) FROM transactions;"

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔴 *Restore Test Failed*",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Weekly restore test failed* for `${{ github.repository }}`"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Workflow:* ${{ github.workflow }}"},
                  {"type": "mrkdwn", "text": "*Run:* ${{ github.run_id }}"}
                ]},
                {"type": "section", "text": {"type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-success:
    name: Notify Success
    if: always() && needs.backup-postgres.result == 'success' && needs.backup-redis.result == 'success'
    needs: [backup-postgres, backup-redis]
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        if: github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Daily Backups Completed*",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Daily backups completed successfully* for `${{ github.repository }}`"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Date:* $(date -u)"},
                  {"type": "mrkdwn", "text": "*PostgreSQL:* ✅ Success"},
                  {"type": "mrkdwn", "text": "*Redis:* ✅ Success"}
                ]}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}