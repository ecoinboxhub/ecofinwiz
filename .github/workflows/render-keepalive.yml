name: render-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render web API to keep free instance awake
        shell: bash
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 150 \
              "https://ecofinwiz-api.onrender.com/api/v1/health" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is warm"
              exit 0
            fi
            sleep 30
          done
          exit 0