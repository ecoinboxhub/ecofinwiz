name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff linter
        run: ruff check app/

  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke tests (mocked)
        env:
          SECRET_KEY: test-secret-key
        run: |
          pytest tests/ -v -m smoke --no-header -q

  integration-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finwize
          POSTGRES_PASSWORD: finwize
          POSTGRES_DB: finwize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://finwize:finwize@localhost:5432/finwize_test
          SECRET_KEY: test-secret-key
          MONGODB_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install alembic
          alembic upgrade head
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://finwize:finwize@localhost:5432/finwize_test
          SECRET_KEY: test-secret-key
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB_NAME: finwize_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -v -m integration --no-header -q

  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, smoke-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t finwize-api ./backend
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        run: |
          docker tag finwize-api ${{ secrets.DOCKER_USERNAME }}/finwize-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/finwize-api:latest

  flutter-build:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        flavor: [development, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable
      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Build APK (${{ matrix.flavor }})
        working-directory: ./mobile
        run: |
          flutter build apk --flavor ${{ matrix.flavor }} --dart-define=FLUTTER_APP_FLAVOR=${{ matrix.flavor }}
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finwize-apk-${{ matrix.flavor }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          retention-days: 7
