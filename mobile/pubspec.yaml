name: finwize
description: Finwize - Financial & Business Guidance for Africa
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.0
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.0
  url_launcher: ^6.3.0
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  sentry_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env
    - .env.development
    - .env.staging
