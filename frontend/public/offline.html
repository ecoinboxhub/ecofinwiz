<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EcoFinwize" />
    <title>You're offline - EcoFinwize</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      html { overflow-x: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #f3f4f6;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        padding: 40px 28px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #38bdf8, #0284c7);
        color: #fff;
        font-weight: 800;
        font-size: 26px;
        margin-bottom: 20px;
      }
      h1 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 8px; }
      p { font-size: 14px; line-height: 1.55; color: #6b7280; margin-bottom: 24px; }
      .btn {
        width: 100%;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 14px;
        background: #0ea5e9;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      .btn:active { transform: scale(0.97); background: #0284c7; }
      a.link {
        display: block;
        margin-top: 14px;
        color: #0284c7;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111827; color: #f3f4f6; }
        .card { background: #1f2937; border-color: #374151; }
        h1 { color: #f9fafb; }
        p { color: #9ca3af; }
        a.link { color: #38bdf8; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="logo" aria-hidden="true">E</div>
      <h1>You're offline</h1>
      <p>
        EcoFinwize needs a connection to load fresh financial information.
        Check your connection and try again — your saved data is safe.
      </p>
      <button class="btn" type="button" onclick="location.reload()">Try again</button>
      <a class="link" href="/">Open EcoFinwize</a>
    </main>
  </body>
</html>
