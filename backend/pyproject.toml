[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finwize-api"
version = "0.1.0"
description = "Finwize — AI-Powered Financial & Business Guidance Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "motor>=3.6.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "sentry-sdk>=2.17.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.3.0",
    "pinecone-client>=5.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: fast, mocked tests that run everywhere (default)",
    "integration: tests requiring live PostgreSQL/MongoDB/Redis",
    "external: tests requiring external API keys (AI, RAG, Payments)",
]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
log_cli = true
log_cli_level = "WARNING"
