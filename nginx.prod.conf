# nginx.prod.conf - Production Nginx Configuration
# SSL termination, reverse proxy, security headers, rate limiting
#
# Certificates expected in /etc/nginx/certs/:
# - finwize.app.crt / finwize.app.key (wildcard or SAN cert)
# - dhparam.pem (generated: openssl dhparam -out dhparam.pem 2048)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Upstream servers
    upstream api_backend {
        least_conn;
        server api:8100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:80 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP -> HTTPS redirect (all domains)
    server {
        listen 80;
        listen [::]:80;
        server_name api.finwize.app app.finwize.app admin.finwize.app www.finwize.app;

        # ACME challenge for Let's Encrypt (if not using Cloudflare)
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            allow all;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ==================== API Backend ====================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.finwize.app;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/finwize.app.crt;
        ssl_certificate_key /etc/nginx/certs/finwize.app.key;
        ssl_dhparam /etc/nginx/certs/dhparam.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;

        # Hide nginx version
        server_tokens off;

        # Rate limiting
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn conn_limit 50;

        # Stricter rate limiting for auth endpoints
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            include proxy_params;
        }

        # Stricter rate limiting for AI endpoints
        location ~ ^/api/v1/ai/ {
            limit_req zone=ai_limit burst=30 nodelay;
            proxy_pass http://api_backend;
            include proxy_params;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check (no rate limit)
        location = /api/v1/health {
            access_log off;
            proxy_pass http://api_backend;
            include proxy_params;
        }

        # Main API proxy
        location / {
            proxy_pass http://api_backend;
            include proxy_params;

            # WebSocket support for SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }
    }

    # ==================== Frontend (React) ====================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.finwize.app admin.finwize.app www.finwize.app;

        # SSL Configuration (same as API)
        ssl_certificate /etc/nginx/certs/finwize.app.crt;
        ssl_certificate_key /etc/nginx/certs/finwize.app.key;
        ssl_dhparam /etc/nginx/certs/dhparam.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.finwize.app wss://api.finwize.app; frame-ancestors 'none';" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;

        server_tokens off;

        root /var/www/frontend;
        index index.html;

        # Gzip static files
        gzip_static on;

        # Cache static assets (JS, CSS, images, fonts)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            access_log off;
            try_files $uri =404;
        }

        # Service Worker (no cache)
        location /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        # Main SPA routing
        location / {
            try_files $uri $uri/ /index.html;

            # Security headers for HTML
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # API proxy for frontend (CORS preflight handled by backend)
        location /api/ {
            proxy_pass http://api_backend;
            include proxy_params;
        }
    }

    # ==================== Staging Subdomains ====================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name staging-api.finwize.app staging-app.finwize.app;

        ssl_certificate /etc/nginx/certs/finwize.app.crt;
        ssl_certificate_key /etc/nginx/certs/finwize.app.key;
        ssl_dhparam /etc/nginx/certs/dhparam.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        server_tokens off;

        # Staging API
        location ~ ^/api/ {
            proxy_pass http://staging-api:8100;
            include proxy_params;
            proxy_read_timeout 300s;
        }

        # Staging Frontend
        location / {
            proxy_pass http://staging-frontend:80;
            include proxy_params;
        }
    }

    # ==================== Proxy Parameters (included above) ====================
    # Defined here for reuse
    # Note: These are included inline above via 'include proxy_params;'
    # But we define the actual params here for reference:
    #
    # proxy_params:
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header X-Forwarded-Host $host;
    #   proxy_set_header X-Forwarded-Port $server_port;
    #   proxy_cache_bypass $http_upgrade;
    #   proxy_http_version 1.1;
    #   proxy_set_header Connection "";
    #   proxy_read_timeout 300s;
    #   proxy_send_timeout 300s;
}